#!/bin/bash
# Site profile template. Copy, fill in, and `source` it before any stage.
#
#   cp config/profiles/template.conf config/profiles/mysite.conf
#   # edit every path below
#   source config/profiles/mysite.conf
#
# Source the profile BEFORE pipeline.conf, or on its own - every stage sources
# pipeline.conf itself. pipeline.conf asserts OUT and REFS_DIR, so sourcing it
# first dies immediately.
#
# Record where this package lives on your cluster here, for sync/push.sh:
#   export DFEPIPE_REMOTE="myhost:path/to/dfepipe"
#
# A profile holds only the things that are a property of YOUR MACHINE AND DATA.
# Everything that is a property of the analysis is in config/pipeline.conf, with
# a default that reproduces the manuscript - do not copy those here.
#
# This file is a template, not a runnable profile: it would fail at the first
# stage, which is the point. config/profiles/hoffman_replicate.conf is a real,
# complete one; read it alongside this.
#
# All of these must be exported. The chain passes them to its jobs with
# `qsub -V`, which only carries exported variables.

# --- where the software is ---------------------------------------------------
# The conda env with the patched dadi. setup/setup.sh builds one and prints this
# line for you.
export CONDA_ENV=""

# --- where output goes, and where reference data lives -----------------------
export OUT=""            # writable; every stage writes under here
export REFS_DIR=""       # read-only reference data, and DEMO_P0_DIR beneath it

# --- the variants ------------------------------------------------------------
# Per-chromosome VCFs. {chrom} is substituted with chr1 ... chr22, so the
# literal braces belong in the value.
export VCF_TMPL=""       # e.g. /data/vcf/mask.bisnp.YRI.{chrom}.vcf.gz
export POPFILE=""        # dadi's sample -> population panel
export POP=""            # which population in that panel, e.g. YRI

# --- the four filters prep applies ------------------------------------------
export MASK_BED=""       # accessibility mask: bases to KEEP
export CDS_BED=""        # coding sequence to remove
export HET_BED=""        # heterochromatin to remove
export QUI_BED=""        # the quiescent annotation to remove from the test bed

# --- the neutral controls ----------------------------------------------------
# Set exactly one of these. The per-chromosome form saves all 22 tasks reading
# one large file. NEUTRAL_CTRL_DIR holds <CTRL_TAG>_<chrom>.bed.
#
# This is not the same set as QUI_BED: the control set is usually stricter. In
# this project qui2 is quiescent AND non-coding AND mask-passing AND free of
# ENCODE enhancer/promoter annotation - 688 Mb against QUI_BED's 968 Mb.
export NEUTRAL_CTRL_DIR=""
# export NEUTRAL_CTRL_BED=""

# --- the mutation rates ------------------------------------------------------
export MUTRATE_TAB=""    # directory of per-chromosome rate beds
# If your files are not named MR.{chrnum}_rate_v5.2_TFBS_correction_all.bed:
# export MUTRATE_PATTERN='myrates.{chrnum}.bed'
# ROULETTE_SCALE in pipeline.conf converts a table value to a per-site diploid
# rate. It is Roulette-specific; a different rate table needs a different value.

# --- analysis choices that are really data choices ---------------------------
# These have manuscript defaults in pipeline.conf, but they describe your data,
# so set them deliberately.
# export PROJECTION=160          # needs >= 80 genotyped diploids in POP
# export DEMO_MODEL=three_epoch  # three_epoch or two_epoch; needs a p0 grid
# export CTRL_FLANK=25000        # control window is mid +/- this
# export CTRL_TAG=qui2           # names the control beds and the output files

# --- scheduler, only if this cluster is not Hoffman2 -------------------------
# export SGE_ROOT_DIR=/opt/sge
# export SGE_CELL_NAME=default
# export SGE_ARCH=lx-amd64
# export MODULE_INIT=/etc/profile.d/modules.sh
