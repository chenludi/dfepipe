#!/bin/bash
# Get the pipeline running correctly on Hoffman2 first, using the environment and
# data that already exist there. Portability to another cluster, and the rebuilt
# environment from setup/setup.sh, come after this works. Source AFTER pipeline.conf.
#
# ONE environment: dadi0116 (dadi 2.3.3 + the neugamma patches). The published
# results split demography and cache into dadi0315 (dadi 2.3.0), but we decided to
# standardise on 2.3.3 and validate that change rather than preserve the split.
_nc=/u/home/c/cdi/project-klohmuel/noncdoingdfe

export CONDA_ENV="${_nc}/condaenv/dadi0116"

export REFS_DIR="${_nc}/test_0118"
export OUT="${_nc}/test_0118/output_dfepipe"

export MASK_BED="${_nc}/data/vcf_1kg220425/originalfile/20160622.allChr.mask.bed"
export CDS_BED="${_nc}/data/genecode/CDS_hg38_gencode_v45.bed"
export MUTRATE_TAB="${_nc}/test_0118/data_mut"
# HET and Quiescent: the combined temp_HET.bed / temp_Quies.bed that
# submit_exHETquiencmask.sh used are gone from the cluster; they are the union of
# the per-state files, rebuilt by the prep stage from these globs.
export HET_STATES_GLOB="${_nc}/data/data_ernst/chromHMM_100_states/*_HET[0-9]*.bed"
export QUIES_STATES_GLOB="${_nc}/data/data_ernst/chromHMM_100_states/*_Quies[0-9]*.bed"

export CTRL_FLANK=25000        # mid +/- 25 kb, what every published run used
export CTRL_TAG=qui2
export PROJECTION=160
export DEMO_MODEL=three_epoch
export APPLY_CDF_INTEGRATION=0 # stock quad integration, as the published runs used
