# The conda half of the environment. dadi and dadi-cli are NOT here: they are
# vendored as sdists under setup/vendor/ and installed by setup.sh with
# --no-index, so the version that produced the published results cannot drift
# and that half of the install needs no network.
#
# compilers are required because dadi builds C/Cython extensions
# (integration_c, PDFs_cython, the Triallele transitions) at install time.
name: dfepipe
channels: [conda-forge, bioconda]
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - matplotlib
  - cython
  - c-compiler
  - pytest
  - pip
